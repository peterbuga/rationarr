[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# project information
[project]
version = "0.1.0"
# dynamic = ["version"]
name = "rationarr"
readme = "README.md"
authors = [
    {name = "Peter Buga", email = "no@email.com"}
]
description = "Track and monitor account status on various private linux-iso-websites"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastapi == 0.115.14",
    "uvicorn == 0.34.3",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "SQLAlchemy==2.0.41",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "PyYAML==6.0.2",
    "APScheduler==3.11.0",
    "httpx==0.28.1",
    "alembic==1.16.2",
    "beautifulsoup4==4.13.4",
    "python-slugify==8.0.4",
    "mergedeep == 1.3.4",
    "furl==2.1.4",
    "bitmath==1.3.3.1",
]

[project.optional-dependencies]
all = []

dev = [
#   "pre-commit == 4.0.1",
  "pip-tools == 7.4.1",
  "isort == 5.13.2",
  "black == 24.10.0",
  "ruff == 0.7.0",
  "pytest == 8.3.3",
  "pytest-assert-utils == 0.3.1",
  "pytest-dotenv == 0.5.2",
  "pytest-cov == 5.0.0",
  "types-cachetools == 5.5.0.20240820",
  "mypy == 1.12.1",
]

# # tools configurations
# [tool.hatch.version]
# path = "src/app/__about__.py"

# linting config
[tool.ruff]
extend-exclude = [
  "node_modules",
  "venv",
  "tests",
]

[tool.lint]
# E501: Line too long
# ignore = ["E501"]
line-length = 80
target-version = "py312"

# isort config
[tool.isort]
known_first_party = ["app"]
profile = "black"
line_length = 80
skip = [".env/", "venv", ".venv", "node_modules"]
virtual_env = "venv"

# formatting config
[tool.black]
line-length = 80
extend-exclude = '''
/(
  | .env
  | .venv
  | venv
  | notebooks
  | node_modules
)/
'''

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
