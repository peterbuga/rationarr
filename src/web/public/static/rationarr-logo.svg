<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#2C3E50"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#34495E" stroke-width="2"/>
  
  <!-- Ratio indicator arc (progress circle) -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#3498DB" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="353.25 471" transform="rotate(-90 100 100)" opacity="0.3"/>
  
  <!-- Active ratio arc (75% filled to show good ratio) -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#95A5A6" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="353.25 471" transform="rotate(-90 100 100)">
    <animate attributeName="stroke-dasharray" 
             values="0 471;353.25 471" 
             dur="2s" 
             fill="freeze"/>
  </circle>
  
  <!-- Center circle background -->
  <circle cx="100" cy="100" r="58" fill="#34495E"/>
  
  <!-- Ratio symbol - up and down arrows -->
  <g transform="translate(100, 100)">
    <!-- Large up arrow (representing ratio improvement) -->
    <g transform="translate(-12, -5)">
      <path d="M 0 20 L 0 -25 M 0 -25 L -10 -15 M 0 -25 L 10 -15" 
            stroke="#ECF0F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    
    <!-- Smaller down arrow (representing download/consumption) -->
    <g transform="translate(12, 5)">
      <path d="M 0 -15 L 0 20 M 0 20 L -8 12 M 0 20 L 8 12" 
            stroke="#95A5A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Subtle gear teeth on outer edge for automation theme -->
  <g fill="#34495E" opacity="0.4">
    <rect x="97" y="5" width="6" height="8" rx="1"/>
    <rect x="97" y="5" width="6" height="8" rx="1" transform="rotate(45 100 100)"/>
    <rect x="97" y="5" width="6" height="8" rx="1" transform="rotate(90 100 100)"/>
    <rect x="97" y="5" width="6" height="8" rx="1" transform="rotate(135 100 100)"/>
    <rect x="97" y="5" width="6" height="8" rx="1" transform="rotate(180 100 100)"/>
    <rect x="97" y="5" width="6" height="8" rx="1" transform="rotate(225 100 100)"/>
    <rect x="97" y="5" width="6" height="8" rx="1" transform="rotate(270 100 100)"/>
    <rect x="97" y="5" width="6" height="8" rx="1" transform="rotate(315 100 100)"/>
  </g>
</svg>