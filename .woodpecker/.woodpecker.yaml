when:
  - event: ["tag", "push", "manual", "cron"]

labels:
  builder: "amd64arm64"

steps:
  - name: "build-and-push"
    image: "woodpeckerci/plugin-docker-buildx"
    settings:
      platforms: "linux/amd64,linux/arm64/v8"
      dockerfile: "Dockerfile"
      context: "./"
      registry:
        from_secret: "REGISTRY_OCI"
      repo:
        from_secret: "REGISTRY_REPO"
      tags:
        - "latest"
        - "${CI_COMMIT_SHA}"
        - "${CI_COMMIT_TAG=notag}"
      username:
        from_secret: "REGISTRY_USER"
      password:
        from_secret: "REGISTRY_PASSWORD"
  - name: "docker-ls"
    image: "alpine/curl"
    environment:
      WEBHOOK_RECREATE_URL:
        from_secret: "WEBHOOK_RECREATE_URL"
    commands:
      - "curl -sL -X POST $WEBHOOK_RECREATE_URL"
